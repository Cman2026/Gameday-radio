<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gameday Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
/* Layout: stadium-night scoreboard. Game list on the left, selected game + radio deck on the right; stacks on phones. */
:root{
  --night:#0d1218; --panel:#151c25; --panel-2:#1c2531; --line:#2a3644;
  --chalk:#e9eef3; --dim:#8d9cab; --turf:#3fb36b; --bulb:#ffc23d; --red:#ff5d5d;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--chalk);font:15px/1.45 var(--body)}
a{color:var(--bulb)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
h1{font:800 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h1 span{color:var(--bulb)}
.status{font:500 12px var(--mono);color:var(--dim);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
.dot.ok{background:var(--turf)} .dot.err{background:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;gap:8px}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;display:grid;gap:4px}
.card[aria-current="true"]{border-color:var(--bulb);box-shadow:0 0 0 1px var(--bulb) inset}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .tm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.card .tm img{width:22px;height:22px;object-fit:contain}
.card .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sc{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.card .meta{font:500 11px var(--mono);color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.live{color:var(--red)} .live::before{content:"● ";}
.ear{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);border-radius:999px;padding:5px 10px 5px 8px;font:600 12px var(--body);cursor:pointer}
.ear::before{content:"▶";font-size:10px;color:var(--bulb)}
.ear.on{background:var(--bulb);color:var(--night);border-color:var(--bulb)} .ear.on::before{content:"❚❚";color:var(--night)}
.ear.wait::before{content:"…"}
.ear[disabled]{opacity:.45;cursor:default}
.card .row .right{display:flex;align-items:center;gap:10px}
.side .ear{justify-self:center;margin-top:4px}
.more{display:contents} .more[hidden]{display:none!important}
.syncrow{display:flex;align-items:center;gap:6px;flex:1 1 100%;font:500 12px var(--mono);color:var(--dim)}
.syncrow .lab{text-transform:uppercase;letter-spacing:.1em;font:600 11px var(--body)}
.syncrow .val{min-width:118px;text-align:center;color:var(--chalk);font-variant-numeric:tabular-nums}
.btn.sm{padding:5px 10px;font-size:13px}
.filters{display:grid;gap:8px;margin-bottom:10px}
.filters input[type=search]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--chalk)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.chip .n{opacity:.6;margin-left:4px;font:500 11px var(--mono)}
.fav{flex:none;border:0;background:none;color:var(--dim);font-size:16px;line-height:1;cursor:pointer;padding:2px}
.fav.on{color:var(--bulb)}
.card .div{font:600 10px var(--body);letter-spacing:.08em;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.empty{color:var(--dim);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:16px}

.board{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;min-width:0}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.side img{width:64px;height:64px;object-fit:contain}
.side .nm{font:700 20px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.side .rec{font:500 11px var(--mono);color:var(--dim)}
.side .big{font:800 64px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--bulb);text-shadow:0 0 18px rgba(255,194,61,.25)}
.side.poss .nm::after{content:" 🏈";font-size:.8em}
.to{display:flex;gap:4px;justify-content:center}
.to i{width:14px;height:4px;border-radius:2px;background:var(--bulb)} .to i.used{background:var(--line)}
.mid{text-align:center;display:grid;gap:4px}
.clock{font:500 26px var(--mono);font-variant-numeric:tabular-nums}
.per{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.sit{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{font:600 12px var(--body);padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.pill.rz{background:var(--red);border-color:var(--red);color:#fff}
.field{position:relative;height:46px;border-radius:6px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#24703f 0 10%,#2a7c47 10% 20%);border:2px solid #e9eef3}
.field .ez{position:absolute;top:0;bottom:0;width:8%;display:flex;align-items:center;justify-content:center;font:700 10px var(--display);color:#fff;letter-spacing:.1em;writing-mode:vertical-rl}
.field .ez.l{left:0} .field .ez.r{right:0}
.field .ball{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--bulb);box-shadow:0 0 10px var(--bulb);transition:left .6s}
.field .fd{position:absolute;top:0;bottom:0;width:2px;background:var(--bulb);opacity:.85;transition:left .6s}
.field .ls{position:absolute;top:0;bottom:0;width:2px;background:#4da3ff;transition:left .6s}
.last{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bulb);border-radius:8px;padding:10px 12px}
.label{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:0 0 4px}
.wp{display:grid;gap:4px}
.wpbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.wpbar span{display:block;height:100%}
.wpl{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--dim)}
.plays{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px}
.drive{padding:8px 12px;background:var(--panel-2);font:600 12px var(--body);display:flex;justify-content:space-between;gap:8px;position:sticky;top:0}
.play{padding:6px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13px;border-top:1px solid var(--line)}
.play .t{font:500 11px var(--mono);color:var(--dim);white-space:nowrap;padding-top:2px}
.play.scoring{background:rgba(255,194,61,.08)} .play.scoring .tx{font-weight:600}
.play .dd{display:block;font:500 11px var(--mono);color:var(--dim)}

/* radio deck fixed to bottom */
.deck{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0e13ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.deck-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.play-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--bulb);color:var(--night);font-size:18px;cursor:pointer;flex:none}
.now{min-width:0;flex:1 1 180px}
.now b{display:block;font:700 16px var(--display);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now small{color:var(--dim);font-size:12px}
.deck select,.deck input[type=url]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.deck select{flex:0 1 230px}
.deck input[type=url]{flex:1 1 220px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.sync{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--dim)}
.sync input{width:110px;accent-color:var(--bulb)}
.vol{width:90px;accent-color:var(--bulb)}
.radio-info{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;display:grid;gap:6px}
.radio-info ul{margin:0;padding-left:18px}
.note{color:var(--dim);font-size:12px}
@media (prefers-reduced-motion:reduce){.field .ball,.field .fd,.field .ls{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Gameday</span> Radio</h1>
    <div class="status"><span><i class="dot" id="dot"></i><span id="stat">Loading scores…</span></span><span id="upd"></span></div>
  </header>
  
  <div class="grid">
    <div>
      <div class="filters">
        <input type="search" id="q" placeholder="Find a team" aria-label="Find a team" autocomplete="off">
        <div class="chips" role="group" aria-label="Filter games">
          <button class="chip" data-div="all" aria-pressed="true">All<span class="n" id="nAll"></span></button>
          <button class="chip" data-div="FBS" aria-pressed="false">FBS<span class="n" id="nFBS"></span></button>
          <button class="chip" data-div="FCS" aria-pressed="false">FCS<span class="n" id="nFCS"></span></button>
          <button class="chip" data-div="fav" aria-pressed="false">★ My teams<span class="n" id="nFav"></span></button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
    <main id="board" class="board"><p class="note">Pick a game.</p></main>
  </div>
</div>

<div class="deck">
  <div class="deck-in">
    <button class="play-btn" id="pp" aria-label="Play radio">▶</button>
    <div class="now"><b id="nowName">Radio off</b><small id="nowSub">Tap Listen next to a team</small></div>
    <select id="station" aria-label="Station" hidden></select>
    <div class="syncrow" role="group" aria-label="Sync scores with the radio">
      <span class="lab">Sync</span>
      <button class="btn sm" id="scoresLess" aria-label="Show scores 2 seconds sooner">−</button>
      <span class="val" id="delayV">Scores live</span>
      <button class="btn sm" id="scoresMore" aria-label="Hold scores 2 seconds longer">+</button>
      <button class="btn sm" id="nudge" title="Pause the radio 5 seconds so it falls further behind">Radio −5s</button>
    </div>
    <button class="btn" id="moreBtn" aria-expanded="false">More</button>
    <span class="more" id="more" hidden><input type="url" id="custom" placeholder="Or paste a stream URL (.mp3, .aac, .m3u8)" aria-label="Custom stream URL">
    <button class="btn" id="useCustom">Use URL</button>
    <input type="range" id="delay" min="0" max="120" step="1" value="0" aria-label="Score delay" hidden>
    <input type="range" id="vol" class="vol" min="0" max="1" step="0.05" value="0.9" aria-label="Volume"></span>
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
// Radio networks. "streams" are tried in order until one plays.
// Strings are direct audio URLs; {tunein:"sNNN"} is resolved to a direct URL through TuneIn's public tune service.
const sn = call => [3,9,6,5,7,2,4,8,1].map(n=>`https://ice${n}.securenetsystems.net/${call}`);
const RADIO = {
  "Jacksonville State": {net:"Gamecock Radio Network", station:"WLJS 91.9 FM (Jacksonville, AL)", streams:["https://s8.yesstreaming.net:7014/stream","http://s8.yesstreaming.net:7014/stream"], listen:"https://www.jsuchanticleer.com/wljs919/site/listen.html"},
  "New Mexico State":  {net:"Aggie Sports Network", station:"KXPZ 99.5 FM (Las Cruces)", streams:[{tunein:"s273730"}, ...sn("KXPZ")], listen:"https://tunein.com/radio/New-Mexico-St-Football-s273730/"},
  "Kennesaw State":    {net:"KSU Owl Network", station:"KSU Owl Network (online)", streams:["https://edge.mixlr.com/channel/iryqq"], listen:"https://ksuowls.com/coverage"},
  "Middle Tennessee":  {net:"Blue Raider Network", station:"WGNS 1450 AM / 100.5 FM (Murfreesboro)", streams:[...sn("WGNS"), {tunein:"s273724"}], listen:"https://radio.securenetsystems.net/v5/WGNS"},
};
const base = "https://site.api.espn.com/apis/site/v2/sports/football/college-football";
let filter = "live", events = [], selected = null, history = [], summaryHist = [], delay = 0;
const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Every Division I team's radio, from radio.json (researched per school).
const normName = x => String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/&/g," and ").replace(/\bst\.?\b/g,"state").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const dirIndex = new Map();
async function loadDirectory(){
  try{
    const d = await getJSON("radio.json");
    for(const t of d.teams||[]) for(const n of [t.school, ...(t.names||[])]) if(n && !dirIndex.has(normName(n))) dirIndex.set(normName(n), t);
    events.forEach(e=>e.competitions[0].competitors.forEach(c=>attachRadio(c.team)));
    render(); fillStations();
  }catch(e){ /* no directory yet: hand-checked teams still work */ }
}
function attachRadio(tm){
  if(!tm || RADIO[tm.location] || !dirIndex.size) return;
  const tries = [tm.location, tm.displayName, `${tm.location} ${tm.name||""}`, tm.shortDisplayName, tm.abbreviation];
  let hit = null; for(const n of tries){ hit = dirIndex.get(normName(n)); if(hit) break; }
  if(!hit || !(hit.streams||[]).length){ if(hit) RADIO_INFO[tm.location] = hit; return; }
  RADIO[tm.location] = {net: hit.network || `${tm.location} radio`, station: hit.flagship || "", streams: hit.streams, listen: hit.listen_page || ""};
}
const RADIO_INFO = {}; // teams we know about but have no free stream for
let divFilter = "all", query = "";
const favs = new Set(JSON.parse(store.get("favs")||"[]"));
function saveFavs(){ store.set("favs", JSON.stringify([...favs])); }
const isFavGame = e => e.competitions[0].competitors.some(t=>favs.has(t.team.location));
function fmtTime(d){return new Date(d).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit", hour12:true})}
function now12(){return new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true})}

async function getJSON(u){const r = await fetch(u,{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json();}

async function poll(){
  try{
    const [fbs, fcs] = await Promise.all([
      getJSON(`${base}/scoreboard?groups=80&limit=400`),
      getJSON(`${base}/scoreboard?groups=81&limit=400`).catch(()=>({events:[]})),
    ]);
    const byId = new Map();
    (fbs.events||[]).forEach(e=>{ e._div = "FBS"; byId.set(e.id, e); });
    (fcs.events||[]).forEach(e=>{ if(!byId.has(e.id)){ e._div = "FCS"; byId.set(e.id, e); } });
    const evs = [...byId.values()];
    evs.forEach(e=>e.competitions[0].competitors.forEach(c=>attachRadio(c.team)));
    history.push({t:Date.now(), evs}); history = history.filter(h => Date.now()-h.t < 180000);
    $("#dot").className = "dot ok"; $("#stat").textContent = "Live feed connected"; $("#upd").textContent = "Updated " + now12();
    const live = evs.filter(e=>e.status.type.state==="in");
    if(!selected || !live.some(e=>e.id===selected)){ selected = (live.find(isFavGame) || live[0])?.id || null; }
    // Preload every live game: the selected one refreshes every 9s, the rest every 30s,
    // and each team's radio is looked up ahead of time so Listen starts right away.
    live.forEach(e=>{ pollSummary(e.id, e.id===selected ? 9000 : 30000); e.competitions[0].competitors.forEach(t=>prepareTeam(t.team.location)); });
  }catch(e){
    $("#dot").className = "dot err";
    $("#stat").textContent = "Can't reach the ESPN feed. Open this file in a desktop browser (Safari, Chrome) and check your connection.";
  }
  render();
}
const sumAt = {};
async function pollSummary(id, gap=9000){
  if(Date.now() - (sumAt[id]||0) < gap) return; sumAt[id] = Date.now();
  try{ const s = await getJSON(`${base}/summary?event=${id}`); summaryHist.push({t:Date.now(), id, s}); summaryHist = summaryHist.filter(h=>Date.now()-h.t<180000); render(); }catch(e){}
}
function snap(arr, match){ // newest snapshot at least `delay` seconds old
  const cut = Date.now() - delay*1000; let pick = null;
  for(const h of arr){ if(match && !match(h)) continue; if(h.t <= cut) pick = h; }
  if(!pick){ const m = arr.filter(h=>!match||match(h)); pick = m[0]; }
  return pick;
}

function render(){
  const s = snap(history); events = s ? s.evs : []; events.forEach(e=>{ if(e.status?.type?.state==='in') trackClock(e, s.t); });
  const order = {in:0, pre:1, post:2};
  const live = events.filter(e=>e.status.type.state==="in");
  const count = f => live.filter(f).length;
  $("#nAll").textContent = live.length; $("#nFBS").textContent = count(e=>e._div==="FBS");
  $("#nFCS").textContent = count(e=>e._div==="FCS"); $("#nFav").textContent = count(isFavGame);
  const q = query.trim().toLowerCase();
  let shown = live.filter(e=> divFilter==="all" || (divFilter==="fav" ? isFavGame(e) : e._div===divFilter))
    .filter(e=> !q || e.competitions[0].competitors.some(t=>[t.team.location,t.team.displayName,t.team.shortDisplayName,t.team.abbreviation].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=> (isFavGame(b)-isFavGame(a)) || new Date(a.date)-new Date(b.date) || a.id.localeCompare(b.id));
    const list = $("#list");
  if(!shown.length){
    const next = events.filter(e=>e.status.type.state==="pre").sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
    const why = !live.length ? "No Division I games are live right now." : (q ? `No live games match “${esc(query.trim())}”.` : divFilter==="fav" ? "None of your teams are playing right now. Tap ☆ on a team to add it." : `No ${divFilter} games are live right now.`);
    list.innerHTML = `<div class="empty">${why}${!live.length && next ? `<br>Next up: ${esc(next.shortName)}, ${fmtTime(next.date)}.` : ""}</div>`;
  } else list.innerHTML = shown.map(card).join("");
  list.querySelectorAll(".card").forEach(b=>{ const go=()=>{selected=b.dataset.id; render();}; b.onclick=ev=>{ if(ev.target.closest(".ear,.fav")) return; go(); }; b.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); go(); } }; });
  renderBoard();
}
let currentTeam = null, connecting = null;
const ready = {}; // team -> flat list of direct stream URLs, best first
function ear(loc, label){
  const has = (RADIO[loc]?.streams?.length) || store.get("stream:"+loc);
  if(!has) return `<button class="ear" disabled title="No radio stream on file">${esc(label)}</button>`;
  const on = currentTeam===loc && !audio.paused, wait = connecting===loc;
  return `<button class="ear ${on?"on":""} ${wait?"wait":""}" data-team="${esc(loc)}" aria-label="${on?"Pause":"Listen to"} ${esc(loc)} radio">${esc(label)}</button>`;
}
async function prepareTeam(loc){
  if(ready[loc]) return;
  const r = RADIO[loc]; if(!r?.streams) return;
  ready[loc] = [];
  const urls = [];
  const good = store.get("ok:"+loc); if(good) urls.push(good);
  const saved = store.get("stream:"+loc); if(saved) urls.push(saved);
  for(const c of r.streams){ for(const u of await resolveCandidate(c)) urls.push(u); }
  ready[loc] = [...new Set(urls)];
}
document.addEventListener("click", ev=>{
  const b = ev.target.closest(".ear[data-team]"); if(!b) return;
  ev.stopPropagation();
  const loc = b.dataset.team;
  if(currentTeam===loc && !audio.paused){ audio.pause(); return; }
  listenTo(loc);
});
function listenTo(loc){
  const r = RADIO[loc]||{};
  currentTeam = loc; connecting = loc;
  const sel = $("#station"); if([...sel.options].some(o=>o.value==="team:"+loc)) sel.value = "team:"+loc;
  const list = (ready[loc] && ready[loc].length) ? ready[loc] : [store.get("stream:"+loc), ...(r.streams||[])].filter(Boolean);
  playList(list, r.net||loc+" radio", r.station||"", loc);
  render();
}

// Game status text. ESPN's feed resets the clock to 15:00 during the break
// between quarters, so detect breaks from the status name and the last play.
const ORD = ["","1st","2nd","3rd","4th"];
const qName = p => p>4 ? (p===5?"OT":`${p-4}OT`) : ORD[p];
const lastSeen = {}; // game id -> last period seen with the clock running
function lastPlayInfo(e){
  const sum = snap(summaryHist, x=>x.id===e.id)?.s, d = sum?.drives;
  let play = null;
  const cur = d?.current?.plays; if(cur?.length) play = cur[cur.length-1];
  if(!play){ const prev = d?.previous; const last = prev?.[prev.length-1]?.plays; if(last?.length) play = last[last.length-1]; }
  const text = e.competitions?.[0]?.situation?.lastPlay?.text || play?.text || "";
  return {text, period: play?.period?.number || null};
}
function breakAfter(e){
  // Returns the quarter that just ended if the game is between quarters, else 0.
  const st = e.status, t = st.type, p = st.period||0, name = t.name||"", sd = t.shortDetail||"";
  if(name==="STATUS_HALFTIME" || /halftime/i.test(sd)) return 2;
  if(name==="STATUS_END_PERIOD" || /^end of/i.test(sd) || st.displayClock==="0:00"){
    const m = sd.match(/(1st|2nd|3rd|4th)/); return m ? ({"1st":1,"2nd":2,"3rd":3,"4th":4})[m[1]] : p;
  }
  if(st.displayClock!=="15:00" || p<=1) return 0;
  // Clock reset to 15:00: a break unless a play has already happened this quarter.
  const lp = lastPlayInfo(e);
  if(lp.period) return lp.period < p ? lp.period : 0;
  const txt = lp.text.match(/end of (?:the )?(1st|2nd|3rd|4th|first|second|third|fourth|half|1st half)/i);
  if(txt){ const w = txt[1].toLowerCase(); return ({"1st":1,first:1,"2nd":2,second:2,half:2,"1st half":2,"3rd":3,third:3,"4th":4,fourth:4})[w] || p-1; }
  if(lastSeen[e.id] && lastSeen[e.id] < p) return lastSeen[e.id];
  return 0;
}
// Running clock: the feed sends a new reading every few seconds; between
// readings, count down locally when the last two readings show the clock moving.
const clk = {};
const toSec = c => { const m = /^(\d+):(\d\d)$/.exec(c||""); return m ? (+m[1])*60 + (+m[2]) : null; };
const fmtSec = n => `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
function trackClock(e, t){
  const st = e.status, raw = `${st.period}|${st.displayClock}`, sec = toSec(st.displayClock);
  const prev = clk[e.id];
  if(prev && prev.raw === raw){
    // A newer reading that hasn't moved means the clock is stopped.
    // The feed can repeat a reading for a few polls, so wait 12s before calling it stopped.
    if(prev.running && Date.now() - prev.at > 12000){ prev.sec = Math.max(0, prev.sec - 12); prev.running = false; } // freeze where it is; the next reading corrects it
    return;
  }
  const real = prev ? Math.max(1, (t - prev.t)/1000) : 0;
  const running = !!(prev && sec!=null && prev.period===st.period && sec < prev.sec && (prev.sec - sec) >= 0.5*real && st.type.state==="in");
  clk[e.id] = {raw, sec, period:st.period, at:Date.now(), t, running};
}
function liveClock(e){
  const c = clk[e.id]; if(!c || c.sec==null) return e.status.displayClock;
  if(!c.running) return fmtSec(c.sec);
  const gone = Math.min(12, Math.floor((Date.now()-c.at)/1000)); // never run more than 12s past the last reading
  return fmtSec(Math.max(0, c.sec - gone));
}
setInterval(()=>{ document.querySelectorAll("[data-clk]").forEach(el=>{ const e = events.find(x=>x.id===el.dataset.clk); if(e) el.textContent = liveClock(e); }); }, 1000);
function statusText(e){
  const st = e.status, t = st.type, p = st.period||0;
  if(t.state!=="in") return {short:t.shortDetail, long:t.shortDetail, brk:false};
  const q = breakAfter(e);
  if(q){
    const lab = q===2 ? "Halftime" : (q===4 && p<=4 ? "End of regulation" : `End of ${qName(q)}`);
    return {short:lab, long:lab, brk:true};
  }
  if(st.displayClock!=="15:00") lastSeen[e.id] = p;
  return {short:`<span data-clk="${e.id}">${liveClock(e)}</span> - ${qName(p)}`, long:p>4?qName(p):`${qName(p)} Qtr`, brk:false};
}
function team(c, side){return c.competitors.find(t=>t.homeAway===side)}
function card(e){
  const c = e.competitions[0], a = team(c,"away"), h = team(c,"home"), st = e.status.type;
  const showScore = st.state!=="pre";
  const row = t => `<div class="row"><span class="tm"><button class="fav ${favs.has(t.team.location)?"on":""}" data-fav="${esc(t.team.location)}" aria-label="${favs.has(t.team.location)?"Remove":"Add"} ${esc(t.team.location)} ${favs.has(t.team.location)?"from":"to"} my teams">${favs.has(t.team.location)?"★":"☆"}</button><img src="${t.team.logo||""}" alt=""><span>${t.curatedRank?.current<26?`<small>${t.curatedRank.current}</small> `:""}${esc(t.team.shortDisplayName)}</span></span><span class="right">${ear(t.team.location, "Listen")}<span class="sc">${showScore?t.score:""}</span></span></div>`;
  return `<div class="card" role="button" tabindex="0" data-id="${e.id}" aria-current="${e.id===selected}">${row(a)}${row(h)}
  <div class="meta"><span class="${st.state==="in"?"live":""}">${st.state==="pre"?fmtTime(e.date):statusText(e).short}</span><span>${esc((c.broadcasts||[]).flatMap(b=>b.names).join(", "))}<span class="div">${e._div||""}</span></span></div></div>`;
}

function renderBoard(){
  const e = events.find(x=>x.id===selected); const B = $("#board");
  if(!e){B.innerHTML = `<p class="note">Pick a game.</p>`; return;}
  const c = e.competitions[0], a = team(c,"away"), h = team(c,"home"), st = e.status, sit = c.situation||{};
  const ss = snap(summaryHist, x=>x.id===selected); const sum = ss?.s;
  const side = (t, cls) => {
    const tos = cls==="home"?sit.homeTimeouts:sit.awayTimeouts;
    return `<div class="side ${sit.possession===t.team.id?"poss":""}"><img src="${t.team.logo||""}" alt="">
    <div class="nm">${t.team.location}</div><div class="rec">${t.records?.[0]?.summary||""}${cls==="home"?" · Home":""}</div>
    <div class="big">${st.type.state==="pre"?"–":t.score}</div>${ear(t.team.location, "Listen")}
    ${tos!=null?`<div class="to" aria-label="${tos} timeouts left">${[0,1,2].map(i=>`<i class="${i<tos?"":"used"}"></i>`).join("")}</div>`:""}</div>`;
  };
  const stx = statusText(e), per = stx.long;
  let html = `<div class="score">${side(a,"away")}<div class="mid"><div class="clock">${st.type.state==="in"&&!stx.brk?`<span data-clk="${e.id}">${liveClock(e)}</span>`:""}</div><div class="per">${st.type.state==="pre"?fmtTime(e.date):per}</div></div>${side(h,"home")}</div>`;
  if(st.type.state==="in"){
    const pills = [];
    if(sit.downDistanceText) pills.push(`<span class="pill">${sit.downDistanceText}</span>`);
    if(sit.isRedZone) pills.push(`<span class="pill rz">Red zone</span>`);
    if(pills.length) html += `<div class="sit">${pills.join("")}</div>`;
    html += fieldView(sit, a, h);
  }
  const lp = sit.lastPlay?.text || lastPlayFrom(sum);
  if(lp) html += `<div class="last"><p class="label">Last play</p>${esc(lp)}</div>`;
  const wp = sum?.winprobability; if(wp?.length){ const hp = wp[wp.length-1].homeWinPercentage*100;
    html += `<div class="wp"><p class="label">Win probability</p><div class="wpbar"><span style="width:${100-hp}%;background:#${a.team.color||"888"}"></span><span style="width:${hp}%;background:#${h.team.color||"ccc"}"></span></div><div class="wpl"><span>${a.team.abbreviation} ${(100-hp).toFixed(1)}%</span><span>${h.team.abbreviation} ${hp.toFixed(1)}%</span></div></div>`; }
  html += playsView(sum);
  const r = radioFor(e);
  html += `<div class="radio-info"><p class="label">Radio for this game</p><ul>${r.map(x=>`<li><b>${x.team}:</b> ${x.net}, ${x.station}${x.stream?" · <a href='#' data-play='"+x.team+"'>play here</a>":""}${x.listen?` · <a href="${x.listen}" target="_blank" rel="noopener">official listen</a>`:""}</li>`).join("")}</ul>
  <span class="note">Radio comes from each school's own broadcast network. Some schools don't stream every game online; if a Listen button can't connect, try the other team's call.</span></div>`;
  B.innerHTML = html;
  B.querySelectorAll("[data-play]").forEach(l=>l.onclick=ev=>{ev.preventDefault(); $("#station").value = "team:"+l.dataset.play; startStation();});
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function lastPlayFrom(sum){const p = sum?.drives?.current?.plays; return p?.length ? p[p.length-1].text : null}
function fieldView(sit, a, h){
  // ESPN yardLine: 0-100 from home end zone? Use yardsToEndzone + possession for direction.
  if(sit.yardLine==null) return "";
  const homePoss = sit.possession===h.team.id;
  // Place line of scrimmage: away goal on left (0), home goal on right (100). Away drives right.
  let pos = sit.yardLine; // ESPN: distance from home team's goal is 100 - yardLine in most feeds
  if(sit.yardsToEndzone!=null) pos = homePoss ? sit.yardsToEndzone : 100 - sit.yardsToEndzone;
  const toPct = y => 8 + (y/100)*84;
  const fdY = sit.distance ? (homePoss ? pos - sit.distance : pos + sit.distance) : null;
  return `<div class="field" aria-label="Ball on the ${sit.possessionText||""}"><div class="ez l" style="background:#${a.team.color||"333"}">${a.team.abbreviation}</div><div class="ez r" style="background:#${h.team.color||"333"}">${h.team.abbreviation}</div>
  <div class="ls" style="left:${toPct(pos)}%"></div>${fdY!=null&&fdY>0&&fdY<100?`<div class="fd" style="left:${toPct(fdY)}%"></div>`:""}<div class="ball" style="left:${toPct(pos)}%"></div></div>`;
}
function playsView(sum){
  const d = sum?.drives; if(!d) return "";
  const drives = [...(d.previous||[])]; if(d.current && !drives.some(x=>x.id===d.current.id)) drives.push(d.current);
  if(!drives.length) return "";
  const out = drives.slice().reverse().slice(0,8).map(dr=>{
    const plays = (dr.plays||[]).slice().reverse().map(p=>`<div class="play ${p.scoringPlay?"scoring":""}"><span class="t">Q${p.period?.number||""} ${p.clock?.displayValue||""}</span><span class="tx">${esc(p.text||"")}${p.start?.downDistanceText?`<span class="dd">${p.start.downDistanceText}</span>`:""}</span></div>`).join("");
    return `<div class="drive"><span>${dr.team?.shortDisplayName||dr.team?.abbreviation||""} drive${dr.displayResult?` · ${dr.displayResult}`:""}</span><span class="note">${dr.description||""}</span></div>${plays}`;
  }).join("");
  return `<div><p class="label">Play by play</p><div class="plays">${out}</div></div>`;
}
function radioFor(e){
  return e.competitions[0].competitors.slice().sort((x,y)=>x.homeAway==="home"?1:-1).map(t=>{
    const info = RADIO_INFO[t.team.location];
    const r = RADIO[t.team.location] || {net: info?.network || `${t.team.location} radio`, station: (info?.flagship||"") + " (no free online stream found)", listen: info?.listen_page || ""};
    const saved = store.get("stream:"+t.team.location);
    return {team:t.team.location, ...r, stream: saved || (r.streams&&r.streams.length ? "auto" : null)};
  });
}

/* ---------- radio ---------- */
const audio = $("#audio"); let hls = null;
function fillStations(){
  const sel = $("#station"), teams = new Set();
  events.filter(e=>e.status.type.state==="in").forEach(e=>e.competitions[0].competitors.forEach(t=>{ if(RADIO[t.team.location] || store.get("stream:"+t.team.location)) teams.add(t.team.location); }));
  if(currentTeam) teams.add(currentTeam);
  const cur = sel.value;
  sel.innerHTML = `<option value="">Choose a team's radio…</option>` + [...teams].sort().map(t=>{
    const has = store.get("stream:"+t) || RADIO[t]?.streams?.length;
    return `<option value="team:${t}">${t}${has?"":" (needs URL)"}</option>`;}).join("");
  if(cur) sel.value = cur;
}
function suggestStation(){ const e = events.find(x=>x.id===selected); if(!e || !audio.paused) return;
  const home = team(e.competitions[0],"home").team.location; $("#station").value = "team:"+home; }
function startStation(){
  const v = $("#station").value; if(!v) return;
  const t = v.slice(5); if(RADIO[t]?.streams?.length || store.get("stream:"+t)){ listenTo(t); return; }
  const r = RADIO[t]||{}, saved = store.get("stream:"+t);
  const list = saved ? [saved, ...(r.streams||[])] : (r.streams||[]);
  if(list.length){ playList(list, r.net||t+" radio", r.station||""); return; }
  const url = null;
  if(!url){ $("#nowName").textContent = t; $("#nowSub").innerHTML = `No direct stream saved. Paste one below, or <a href="${r.listen||"https://tunein.com/search/?query="+encodeURIComponent(t+" football")}" target="_blank" rel="noopener">open the official listen page</a>.`; $("#custom").focus(); return; }
  play(url, r.net||t+" radio", r.station||url);
}
// Try each candidate stream in turn until one starts playing.
let tryToken = 0;
async function resolveCandidate(c){
  if(typeof c === "string") return [c];
  if(c.tunein){
    try{
      const r = await fetch(`https://opml.radiotime.com/Tune.ashx?id=${c.tunein}&render=json&formats=mp3,aac`);
      const j = await r.json(); return (j.body||[]).map(b=>b.url).filter(Boolean);
    }catch(e){ return []; }
  }
  return [];
}
async function playList(list, name, sub, loc){
  const token = ++tryToken;
  $("#nowName").textContent = name; $("#nowSub").textContent = "Connecting…";
  for(const c of list){
    for(const url of await resolveCandidate(c)){
      if(token !== tryToken) return;
      const ok = await tryUrl(url);
      if(token !== tryToken) return;
      if(ok){ $("#nowSub").textContent = sub; if(loc){ store.set("ok:"+loc, url); } connecting = null; render(); return; }
    }
  }
  connecting = null; render();
  $("#nowSub").textContent = "No stream answered. The station may not be streaming this game; try the official listen link.";
}
function tryUrl(url){
  return new Promise(res=>{
    let done = false; const fin = v=>{ if(done) return; done = true; clearTimeout(tm); audio.removeEventListener("playing", onOk); audio.removeEventListener("error", onErr); res(v); };
    const onOk = ()=>fin(true), onErr = ()=>fin(false), tm = setTimeout(()=>fin(false), 8000);
    audio.addEventListener("playing", onOk); audio.addEventListener("error", onErr);
    play(url, $("#nowName").textContent, "Connecting…");
  });
}
function play(url, name, sub){
  if(hls){hls.destroy(); hls=null}
  if(/\.m3u8(\?|$)/i.test(url) && window.Hls && Hls.isSupported() && !audio.canPlayType("application/vnd.apple.mpegurl")){
    hls = new Hls(); hls.loadSource(url); hls.attachMedia(audio);
  } else audio.src = url;
  audio.play().catch(err=>{ $("#nowSub").textContent = "This stream wouldn't start. If it's an http:// link, open this file directly from your computer rather than an https page."; });
  $("#nowName").textContent = name; $("#nowSub").textContent = sub;
}
$("#station").onchange = startStation;
$("#pp").onclick = ()=>{ if(audio.src || hls){ audio.paused ? audio.play() : audio.pause(); } else startStation(); };
audio.addEventListener("play", ()=>render()); audio.addEventListener("pause", ()=>render());
audio.onplay = ()=>{$("#pp").textContent="❚❚"; $("#pp").setAttribute("aria-label","Pause radio")};
audio.onpause = ()=>{$("#pp").textContent="▶"; $("#pp").setAttribute("aria-label","Play radio")};
audio.onerror = ()=>{$("#nowSub").textContent="Stream unavailable right now. Try the official listen link or another URL.";};
$("#vol").oninput = e=> audio.volume = e.target.value;
$("#useCustom").onclick = ()=>{
  const u = $("#custom").value.trim(); if(!u) return;
  const v = $("#station").value;
  if(v){ store.set("stream:"+v.slice(5), u); fillStations(); $("#station").value = v; render(); }
  play(u, v?v.slice(5)+" (saved stream)":"Custom stream", u);
};
$("#nudge").onclick = ()=>{ if(audio.paused) return; audio.pause(); $("#nudge").disabled = true; setTimeout(()=>{audio.play(); $("#nudge").disabled=false}, 5000); };
function setDelay(d){ delay = Math.max(0, Math.min(120, d)); $("#delayV").textContent = delay ? `Scores held ${delay}s` : "Scores live"; store.set("delay", delay); render(); }
$("#scoresMore").onclick = ()=>setDelay(delay+2);
$("#scoresLess").onclick = ()=>setDelay(delay-2);
document.addEventListener("click", ev=>{
  const f = ev.target.closest(".fav[data-fav]"); if(!f) return;
  ev.stopPropagation(); const loc = f.dataset.fav;
  favs.has(loc) ? favs.delete(loc) : favs.add(loc); saveFavs(); render();
}, true);
document.querySelectorAll(".chip[data-div]").forEach(c=>c.onclick=()=>{ divFilter = c.dataset.div; document.querySelectorAll(".chip[data-div]").forEach(x=>x.setAttribute("aria-pressed", String(x===c))); store.set("div", divFilter); render(); });
$("#q").addEventListener("input", e=>{ query = e.target.value; render(); });
$("#moreBtn").onclick = ()=>{ const m=$("#more"); m.hidden=!m.hidden; $("#moreBtn").setAttribute("aria-expanded", String(!m.hidden)); $("#moreBtn").textContent = m.hidden?"More":"Less"; };

(function init(){
  setDelay(+store.get("delay")||0);
  const dv = store.get("div"); if(dv && document.querySelector(`.chip[data-div="${dv}"]`)) document.querySelector(`.chip[data-div="${dv}"]`).click();
  loadDirectory();
  poll().then(fillStations); setInterval(()=>{poll().then(fillStations)}, 5000);
  setInterval(()=>{ if(delay) render(); }, 1000); // step through held-back scores
})();
</script>
