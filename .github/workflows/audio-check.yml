name: Audio double-check
on:
  workflow_dispatch:
    inputs:
      schools:
        description: "Optional school names (blank = every team marked no_radio)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python tools/check_audio.py $SCHOOLS
        env: { SCHOOLS: "${{ github.event.inputs.schools }}" }
      - run: tools/publish.sh "Audio double-check" audio-check.json
