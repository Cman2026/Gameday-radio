name: Find and test radio streams
on:
  workflow_dispatch:
  push:
    paths: ["tools/radio-sources.json", "tools/resolve_radio.py", ".github/workflows/radio.yml"]
  schedule:
    - cron: "23 13 * * 4,5,6"   # Thu-Sat mornings: re-test streams before game days
permissions:
  contents: write
concurrency: radio
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/resolve_radio.py
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add radio.json radio-report.json
          git diff --cached --quiet || git commit -q -m "Update tested radio streams"
          git pull -q --rebase origin main && git push -q origin HEAD:main
