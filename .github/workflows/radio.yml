name: Find and test radio streams
on:
  workflow_dispatch:
  push:
    paths: ["tools/radio-sources.json", "tools/resolve_radio.py", ".github/workflows/radio.yml"]
  schedule:
    - cron: "23 13 * * 4,5,6"   # Thu-Sat mornings: re-test streams before game days
permissions:
  contents: write
concurrency: radio
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python tools/resolve_radio.py
      - name: Publish results
        run: tools/publish.sh "Update tested radio streams" radio.json radio-report.json
