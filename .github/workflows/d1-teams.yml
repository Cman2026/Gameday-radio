name: D1 team list (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          out = {}
          for lg in ["mens-college-basketball", "womens-college-basketball"]:
              u = f"https://site.api.espn.com/apis/site/v2/sports/basketball/{lg}/teams?groups=50&limit=500"
              d = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30))
              teams = [t["team"] for s in d.get("sports", []) for l in s.get("leagues", []) for t in l.get("teams", [])]
              out[lg] = [{"id": t["id"], "location": t.get("location"), "displayName": t.get("displayName"), "name": t.get("name"), "abbreviation": t.get("abbreviation"), "shortDisplayName": t.get("shortDisplayName")} for t in teams]
              print(lg, len(out[lg]))
          json.dump(out, open("d1-teams.json", "w"), indent=0)
          PY
      - run: tools/publish.sh "D1 team list" d1-teams.json
