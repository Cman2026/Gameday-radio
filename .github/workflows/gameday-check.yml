name: Game-time radio check
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 15-23 * * 6"     # Saturdays, 11 AM to 8 PM Eastern (pregame included)
    - cron: "*/20 0-5 * * 0,3,4,5,6"  # evenings into the night, incl. weeknight games
    - cron: "*/20 23 * * 2,3,4,5"  # weeknight kickoffs
permissions:
  contents: write
concurrency: gameday-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python tools/live_showcase.py 2>&1 | tee showcase-log.txt
      - run: python tools/gameday_check.py
      - name: Save results
        env: { MERGE_LIVE_ONLY: "1" }
        run: tools/publish.sh "Game-time radio check" radio-live.json radio.json showcase-log.txt
