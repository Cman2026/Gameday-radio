name: Game-time radio check
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 16-23 * * 6"     # Saturdays, noon to 8 PM Eastern
    - cron: "*/20 0-5 * * 0,3,4,5,6"  # evenings into the night, incl. weeknight games
    - cron: "*/20 23 * * 2,3,4,5"  # weeknight kickoffs
permissions:
  contents: write
concurrency: gameday-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/gameday_check.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add radio-live.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Game-time radio check"
          git pull -q --rebase origin main && git push -q origin HEAD:main
