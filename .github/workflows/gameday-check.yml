name: Game-time radio check (all sports)
on:
  workflow_dispatch:
  schedule:
    # Every sport (football, basketball, hockey, volleyball, baseball, softball): every 20 minutes
    # from about 10 AM to 1:40 AM Eastern (standard time; late West Coast games), every day. It exits in seconds when nothing is live.
    - cron: "*/20 15-23 * * *"
    - cron: "*/20 0-6 * * *"
permissions:
  contents: write
concurrency: gameday-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python tools/live_showcase.py 2>&1 | tee showcase-log.txt
      - run: python tools/gameday_check.py
      - name: Save results
        env: { MERGE_LIVE_ONLY: "1" }
        run: tools/publish.sh "Game-time radio check" radio-live.json radio-live-log.json radio.json showcase-log.txt
