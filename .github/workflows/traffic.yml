name: Weekly traffic report
on:
  workflow_dispatch:
    inputs:
      probe: { description: "Debug: try a few API calls", required: false, default: "" }
      current_week: { description: "Report the week in progress instead of last week", required: false, default: "" }
  schedule:
    - cron: "17 12 * * 1"   # Mondays about 7:17 AM Eastern (the report itself is sent at 8:41 AM)
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/traffic_report.py
        env: { GOATCOUNTER_TOKEN: "${{ secrets.GOATCOUNTER_TOKEN }}", PROBE: "${{ inputs.probe }}", CURRENT_WEEK: "${{ inputs.current_week }}" }
