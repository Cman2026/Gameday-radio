name: Sniff stream from a web player
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated pages to open"
        required: true
permissions:
  contents: write
jobs:
  sniff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python tools/sniff_stream.py ${{ github.event.inputs.urls }}
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add sniff-result.json && git commit -q -m "Sniff result" && git pull -q --rebase origin main && git push -q origin HEAD:main || true
