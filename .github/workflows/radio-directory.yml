name: Build radio directory
on:
  workflow_dispatch:
  push:
    paths: ["tools/build_radio.py", ".github/workflows/radio-directory.yml"]
  schedule:
    - cron: "17 14 * * *"   # daily, refreshes stream addresses
permissions:
  contents: write
concurrency: radio-directory
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_radio.py
      - name: Commit directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add radio.json radio-report.json
          git diff --cached --quiet || git commit -m "Update radio directory"
          git pull --rebase -q origin main && git push -q origin HEAD:main
