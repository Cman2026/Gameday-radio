name: Listen to live streams (all sports)
on:
  workflow_dispatch:
  schedule:
    # Every sport, twice an hour from about 11 AM to 1:40 AM Eastern (standard time), every day (exits fast when nothing is live).
    - cron: "10,40 16-23 * * *"
    - cron: "10,40 0-6 * * *"   # into the small hours Eastern for late West Coast games
    - cron: "10,40 15 * * 6"     # Saturday 10 AM Eastern: early football
permissions:
  contents: write
concurrency: listen
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper
      - run: python tools/listen_check.py 2>&1 | tee listen-log.txt
        env: { GOATCOUNTER_TOKEN: "${{ secrets.GOATCOUNTER_TOKEN }}" }
      - run: tools/publish.sh "Listen to live streams" radio-heard.json listen-log.txt
