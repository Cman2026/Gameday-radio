name: Featured picks report
on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"   # every morning, about 6-7 AM Eastern, after the night's games
permissions:
  contents: read
concurrency: featured-report
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/featured_report.py
        env: { GOATCOUNTER_TOKEN: "${{ secrets.GOATCOUNTER_TOKEN }}" }
      # Not committed, so it isn't on the website. The picks go into this run's log between markers;
      # a scheduled task reads them and rebuilds Connor's private report page with tools/featured_report.py.
      - run: echo "=====FEATURED-LOG-START====="; cat out/featured-log.json; echo; echo "=====FEATURED-LOG-END====="
