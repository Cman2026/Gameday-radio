name: Save today's schedule
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json, sys, urllib.request, datetime, zoneinfo
          sys.path.insert(0, "tools")
          from sports import SPORTS, ESPN, UA
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York")).date()
          out = {}
          for day in (now, now + datetime.timedelta(days=1)):
            d = f"{day:%Y%m%d}"
            for sid, (path, groups) in SPORTS.items():
              seen = {}
              for g in groups:
                try:
                  with urllib.request.urlopen(urllib.request.Request(f"{ESPN}{path}/scoreboard?{g}limit=900&dates={d}", headers=UA), timeout=30) as r:
                    for e in json.loads(r.read()).get("events", []):
                      c = e["competitions"][0]
                      seen[e["id"]] = {"id": e["id"], "name": e.get("shortName"), "date": e["date"], "state": e["status"]["type"]["state"],
                        "teams": [{"location": t["team"].get("location"), "display": t["team"].get("displayName"), "id": t["team"].get("id"), "home": t["homeAway"] == "home"} for t in c["competitors"]]}
                except Exception as ex:
                  print("error", sid, d, ex)
              out[f"{sid}|{d}"] = list(seen.values())
              print(sid, d, len(seen))
          json.dump(out, open("today-games.json", "w"), indent=0)
          PY
      - run: tools/publish.sh "Today's schedule" today-games.json
